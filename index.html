<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="47" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>47</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stage" aria-label="小手机演示">
      <section class="phone" aria-label="手机屏幕">
        <div class="bezel">
          <div class="speaker" aria-hidden="true"></div>
          <div class="screen safe-top hide-phone-status" id="phoneScreen">
            <section class="view home-view active" id="homeView" aria-label="手机桌面">
              <header class="status-bar">
                <span id="clock">09:41</span>
                <span class="signal" aria-label="信号和电量">
                  <i></i><i></i><i></i>
                  <b></b>
                </span>
              </header>

              <div class="wallpaper">
                <div class="date-block">
                  <span>Saturday</span>
                  <strong>7月 18日</strong>
                </div>
                <div class="brand-bear" id="brandBear" aria-label="可拖动小熊">
                  <div class="bear">
                    <span class="bear-ear left"></span>
                    <span class="bear-ear right"></span>
                    <span class="bear-face">
                      <i class="eye left"></i>
                      <i class="eye right"></i>
                      <i class="nose"></i>
                    </span>
                  </div>
                </div>
                <div class="bear-popover" id="bearPopover" aria-hidden="true">
                  <button type="button" id="deleteBearBtn">删除</button>
                </div>
              </div>

              <nav class="dock" aria-label="底部应用">
                <button class="dock-app chat-icon" type="button" data-open-chat aria-label="打开聊天">
                  <span class="bubble-mark" aria-hidden="true"></span>
                </button>
                <button class="dock-app settings-icon" type="button" id="openSettingsBtn" aria-label="打开设置">
                  <span aria-hidden="true"></span>
                </button>
              </nav>
            </section>

            <section class="view chat-view" id="chatView" aria-label="聊天软件">
              <header class="chat-header">
                <button class="back-btn" type="button" id="backBtn" aria-label="返回桌面"></button>
                <div class="header-avatar" aria-hidden="true">N</div>
                <div class="chat-title">
                  <strong id="chatHeaderTitle">对话</strong>
                  <span id="chatHeaderSubtitle">1 个聊天</span>
                </div>
                <div class="toolbar">
                  <button class="tool-btn" type="button" id="toolBtn" aria-label="聊天设置" aria-expanded="false"></button>
                  <button class="add-group-btn" type="button" id="addGroupBtn" aria-label="添加群聊"></button>
                  <button class="add-contact-btn" type="button" id="addContactBtn" aria-label="添加联系人"></button>
                  <button class="add-moment-btn" type="button" id="addMomentBtn" aria-label="发布朋友圈"></button>
                  <div class="tool-panel" id="toolPanel" aria-label="聊天设置面板">
                    <label class="setting-toggle" for="avatarToggle">
                      <span>显示头像</span>
                      <input id="avatarToggle" type="checkbox" checked />
                      <i aria-hidden="true"></i>
                    </label>
                  </div>
                </div>
              </header>

              <div class="chat-content">
                <section class="chat-tab-panel active" id="dialogPanel" aria-label="对话">
                  <label class="conversation-search" for="conversationSearch">
                    <span aria-hidden="true"></span>
                    <input id="conversationSearch" type="search" autocomplete="off" placeholder="搜索对话" aria-label="搜索对话" />
                  </label>
                  <div class="conversation-list" id="conversationList">
                  </div>

                  <div class="conversation-detail" id="conversationDetail">
                    <div class="messages" id="messages" aria-live="polite">
                    </div>

                    <form class="composer" id="composer">
                      <button class="plus-btn" type="button" aria-label="更多"></button>
                      <input id="messageInput" type="text" autocomplete="off" placeholder="输入消息" aria-label="输入消息" />
                      <button class="send-btn" type="submit">发送</button>
                    </form>
                  </div>
                </section>

                <section class="chat-tab-panel simple-panel" id="contactsPanel" aria-label="联系人">
                  <div class="contact-list" id="contactList">
                  </div>
                </section>

                <section class="chat-tab-panel simple-panel" id="momentsPanel" aria-label="朋友圈">
                  <div class="moments-list" id="momentsList"></div>
                </section>

                <section class="chat-tab-panel simple-panel" id="mePanel" aria-label="我的">
                  <article class="profile-card">
                    <span class="list-avatar">我</span>
                    <div>
                      <strong>我的</strong>
                      <span>小手机用户</span>
                    </div>
                  </article>
                </section>
              </div>

              <nav class="chat-tabs" aria-label="聊天底部导航">
                <button class="chat-tab active" type="button" data-chat-tab="dialog" aria-label="对话">对话</button>
                <button class="chat-tab" type="button" data-chat-tab="contacts" aria-label="联系人">联系人</button>
                <button class="chat-tab" type="button" data-chat-tab="moments" aria-label="朋友圈">朋友圈</button>
                <button class="chat-tab" type="button" data-chat-tab="me" aria-label="我的">我的</button>
              </nav>
            </section>

            <div class="modal-overlay" id="contactModal" aria-hidden="true">
              <section class="contact-modal" aria-label="编辑联系人">
                <header>
                  <strong>编辑联系人</strong>
                  <button class="modal-close" type="button" id="closeContactModal" aria-label="关闭"></button>
                </header>
                <button class="avatar-editor" type="button" id="avatarEditor" aria-label="上传头像">
                  <span class="list-avatar" id="editAvatarPreview">N</span>
                  <em>点击选择头像</em>
                </button>
                <label class="edit-field">
                  <span>昵称</span>
                  <input id="contactNameInput" type="text" autocomplete="off" />
                </label>
                <label class="edit-field">
                  <span>人设</span>
                  <textarea id="contactPersonaInput" rows="5" placeholder="可以复制粘贴人设文字到这里"></textarea>
                </label>
                <button class="modal-save" type="button" id="saveContactBtn">保存</button>
                <input id="avatarFileInput" type="file" accept="image/*" hidden />
              </section>
            </div>

            <div class="modal-overlay" id="deleteModal" aria-hidden="true">
              <section class="confirm-modal" aria-label="确认删除联系人">
                <strong id="deleteTitle">删除联系人？</strong>
                <p id="deleteMessage">删除后会移除此联系人的相关信息。</p>
                <div>
                  <button class="modal-delete" type="button" id="confirmDeleteBtn">删除</button>
                  <button class="modal-cancel" type="button" id="cancelDeleteBtn">取消</button>
                </div>
              </section>
            </div>

            <div class="modal-overlay" id="bearAddModal" aria-hidden="true">
              <section class="confirm-modal" aria-label="添加小熊">
                <strong>添加小熊？</strong>
                <p>把小熊重新放回主界面。</p>
                <div>
                  <button class="modal-cancel" type="button" id="cancelAddBearBtn">取消</button>
                  <button class="modal-save" type="button" id="confirmAddBearBtn">添加</button>
                </div>
              </section>
            </div>

            <div class="modal-overlay" id="momentModal" aria-hidden="true">
              <section class="contact-modal moment-modal" aria-label="发布朋友圈">
                <header>
                  <strong>发布朋友圈</strong>
                  <button class="modal-close" type="button" id="closeMomentModal" aria-label="关闭"></button>
                </header>
                <label class="edit-field">
                  <span>文字</span>
                  <textarea id="momentTextInput" rows="5" placeholder="写点什么"></textarea>
                </label>
                <div class="moment-preview" id="momentPreview" aria-hidden="true"></div>
                <div class="moment-tools">
                  <button class="camera-btn" type="button" id="momentCameraBtn" aria-label="添加图片"></button>
                  <div class="camera-options" id="cameraOptions" aria-label="图片选项">
                    <button type="button" id="uploadMomentImageBtn">上传或拍照</button>
                    <button type="button" id="useTextImageBtn">发文字图片</button>
                  </div>
                </div>
                <button class="modal-save" type="button" id="publishMomentBtn">发布</button>
                <input id="momentImageInput" type="file" accept="image/*" hidden />
              </section>
            </div>

            <div class="modal-overlay" id="groupModal" aria-hidden="true">
              <section class="contact-modal group-modal" aria-label="创建群聊">
                <header>
                  <strong>创建群聊</strong>
                  <button class="modal-close" type="button" id="closeGroupModal" aria-label="关闭"></button>
                </header>
                <button class="avatar-editor" type="button" id="groupAvatarEditor" aria-label="上传群聊头像">
                  <span class="list-avatar" id="groupAvatarPreview">群</span>
                  <em>点击选择群头像</em>
                </button>
                <label class="edit-field">
                  <span>群聊名称</span>
                  <input id="groupNameInput" type="text" autocomplete="off" />
                </label>
                <div class="group-members" id="groupMemberList" aria-label="选择群成员"></div>
                <p class="modal-hint" id="groupHint">至少选择两个联系人。</p>
                <button class="modal-save" type="button" id="saveGroupBtn">创建</button>
                <input id="groupAvatarFileInput" type="file" accept="image/*" hidden />
              </section>
            </div>

            <section class="view settings-view" id="settingsView" aria-label="设置软件">
              <header class="settings-header">
                <button class="back-btn" type="button" id="settingsBackBtn" aria-label="返回桌面"></button>
                <strong>设置</strong>
              </header>

              <div class="settings-list">
                <section class="settings-row">
                  <div>
                    <strong>顶部距离</strong>
                    <span id="topDistanceValue">0px</span>
                  </div>
                  <input id="topDistanceRange" type="range" min="-24" max="80" step="1" value="0" aria-label="顶部距离" />
                </section>
                <section class="settings-row compact-row">
                  <div>
                    <strong>显示顶部状态栏</strong>
                    <span>小手机自己的时间和电量</span>
                  </div>
                  <label class="setting-toggle status-toggle" for="phoneStatusToggle">
                    <input id="phoneStatusToggle" type="checkbox" />
                    <i aria-hidden="true"></i>
                  </label>
                </section>
              </div>
            </section>
          </div>
          <div class="home-indicator" aria-hidden="true"></div>
        </div>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
